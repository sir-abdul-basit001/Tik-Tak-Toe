<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151833'/%3E%3Cg stroke='%233A3F6B' stroke-width='3' stroke-linecap='round'%3E%3Cline x1='23' y1='10' x2='23' y2='54'/%3E%3Cline x1='41' y1='10' x2='41' y2='54'/%3E%3Cline x1='10' y1='23' x2='54' y2='23'/%3E%3Cline x1='10' y1='41' x2='54' y2='41'/%3E%3C/g%3E%3Cg stroke='%2300E5C7' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='29' y1='29' x2='37' y2='37'/%3E%3Cline x1='37' y1='29' x2='29' y2='37'/%3E%3C/g%3E%3Ccircle cx='15.5' cy='15.5' r='5' fill='none' stroke='%23FF5D9E' stroke-width='4'/%3E%3C/svg%3E"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Tic <span>Tac</span> Toe</h1>

    <!-- Falling flowers spawn in here on a win -->
    <div class="flowers"></div>

    <div class="msg hide">
      <p class="winner"></p>
    </div>
    <button class="newgame btn">New Game</button>

    <main>
      <div class="container">
        <div class="game">
          <button class="box" data-index="0"></button>
          <button class="box" data-index="1"></button>
          <button class="box" data-index="2"></button>
          <button class="box" data-index="3"></button>
          <button class="box" data-index="4"></button>
          <button class="box" data-index="5"></button>
          <button class="box" data-index="6"></button>
          <button class="box" data-index="7"></button>
          <button class="box" data-index="8"></button>
        </div>
      </div>

      <button class="resetgame btn">Reset Game</button>
    </main>
    <footer>Created by <i>Abdul-Basit</i></footer>
    <script src="script.js"></script>
  </body>
</html>
